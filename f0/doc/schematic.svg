<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <g fill="#1a1a1a">
    <text x="90" y="42" font-size="22" font-weight="bold">f0 — the chipless button-bot</text>
    <text x="90" y="66" font-size="15" fill="#555555">press to wind up &#183; release to wind down</text>
  </g>

  <!-- wires -->
  <g stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- battery -->
    <path d="M90,140 V270"/>
    <path d="M65,270 H115" stroke-width="4"/>
    <path d="M78,288 H102" stroke-width="7"/>
    <path d="M90,288 V480"/>
    <!-- top rail + switch -->
    <path d="M90,140 H200"/>
    <path d="M200,140 L270,108"/>
    <path d="M280,140 H900"/>
    <!-- bottom rail -->
    <path d="M90,480 H900"/>
    <!-- M1 branch -->
    <path d="M360,140 V270"/>
    <circle cx="360" cy="300" r="30"/>
    <path d="M360,330 V480"/>
    <!-- M1 snubber -->
    <path d="M360,180 H300 V225"/>
    <path d="M278,225 H322" stroke-width="3.5"/>
    <path d="M278,237 H322" stroke-width="3.5"/>
    <path d="M300,237 V420 H360"/>
    <!-- M2 branch -->
    <path d="M560,140 V270"/>
    <circle cx="560" cy="300" r="30"/>
    <path d="M560,330 V480"/>
    <!-- M2 snubber -->
    <path d="M560,180 H620 V225"/>
    <path d="M598,225 H642" stroke-width="3.5"/>
    <path d="M598,237 H642" stroke-width="3.5"/>
    <path d="M620,237 V420 H560"/>
    <!-- R1 + supercap branch -->
    <path d="M700,140 V170"/>
    <rect x="686" y="170" width="28" height="50"/>
    <path d="M700,220 V250"/>
    <path d="M675,250 H725" stroke-width="4"/>
    <path d="M675,262 H725" stroke-width="4"/>
    <path d="M700,262 V340"/>
    <path d="M675,340 H725" stroke-width="4"/>
    <path d="M675,352 H725" stroke-width="4"/>
    <path d="M700,352 V480"/>
    <!-- balance resistors -->
    <path d="M700,240 H800 V255"/>
    <rect x="786" y="255" width="28" height="50"/>
    <path d="M800,305 V335"/>
    <rect x="786" y="335" width="28" height="50"/>
    <path d="M800,385 V410 H700"/>
    <path d="M700,320 H800"/>
  </g>

  <!-- LED branch (optional, dashed) -->
  <g stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="6 5">
    <path d="M900,140 V240"/>
    <path d="M885,240 H915 L900,265 Z" fill="none"/>
    <path d="M885,265 H915"/>
    <path d="M900,265 V330"/>
    <rect x="886" y="330" width="28" height="50"/>
    <path d="M900,380 V480"/>
  </g>
  <!-- LED light arrows -->
  <g stroke="#1a1a1a" stroke-width="1.5" fill="none">
    <path d="M916,252 L932,240 M932,240 L926,241 M932,240 L931,246"/>
    <path d="M918,264 L934,252 M934,252 L928,253 M934,252 L933,258"/>
  </g>

  <!-- junction dots -->
  <g fill="#1a1a1a">
    <circle cx="200" cy="140" r="4"/>
    <circle cx="280" cy="140" r="4"/>
    <circle cx="360" cy="140" r="4.5"/>
    <circle cx="560" cy="140" r="4.5"/>
    <circle cx="700" cy="140" r="4.5"/>
    <circle cx="900" cy="140" r="4.5"/>
    <circle cx="360" cy="180" r="4.5"/>
    <circle cx="560" cy="180" r="4.5"/>
    <circle cx="360" cy="420" r="4.5"/>
    <circle cx="560" cy="420" r="4.5"/>
    <circle cx="700" cy="240" r="4.5"/>
    <circle cx="700" cy="320" r="4.5"/>
    <circle cx="700" cy="410" r="4.5"/>
    <circle cx="360" cy="480" r="4.5"/>
    <circle cx="560" cy="480" r="4.5"/>
    <circle cx="700" cy="480" r="4.5"/>
    <circle cx="900" cy="480" r="4.5"/>
  </g>

  <!-- labels -->
  <g fill="#1a1a1a" font-size="14">
    <text x="122" y="272">+</text>
    <text x="100" y="320">4&#215;AA NiMH</text>
    <text x="100" y="338" fill="#555555">4.8&#8211;5.6 V</text>
    <text x="240" y="80" text-anchor="middle" font-weight="bold">big red button</text>
    <text x="240" y="98" text-anchor="middle" fill="#555555">(microswitch, NO)</text>
    <text x="95" y="502" fill="#555555">pack &#8722; (0 V)</text>

    <text x="360" y="306" text-anchor="middle" font-size="18" font-weight="bold">M</text>
    <text x="560" y="306" text-anchor="middle" font-size="18" font-weight="bold">M</text>
    <text x="344" y="263" text-anchor="end" font-size="16">+</text>
    <text x="544" y="347" text-anchor="end" font-size="16">+</text>
    <text x="318" y="296" text-anchor="end">left motor</text>
    <text x="318" y="314" text-anchor="end" fill="#555555">TT 1:90</text>
    <text x="518" y="296" text-anchor="end">right motor</text>
    <text x="518" y="314" text-anchor="end" fill="#555555">TT 1:90, + down</text>
    <text x="300" y="210" text-anchor="middle">100 nF</text>
    <text x="620" y="210" text-anchor="middle">100 nF</text>

    <text x="730" y="190">R1  2.2&#8211;4.7 &#937;, 5 W</text>
    <text x="730" y="208" fill="#555555">inrush limit + fade tuning</text>
    <text x="667" y="255" text-anchor="end" font-size="16">+</text>
    <text x="662" y="273" text-anchor="end">C1  10 F 3 V</text>
    <text x="667" y="345" text-anchor="end" font-size="16">+</text>
    <text x="662" y="363" text-anchor="end">C2  10 F 3 V</text>
    <text x="822" y="278">R2  4.7 k</text>
    <text x="822" y="358">R3  4.7 k</text>
    <text x="822" y="376" fill="#555555">(balance)</text>

    <text x="900" y="505" text-anchor="middle" fill="#555555">button LED (optional,</text>
    <text x="900" y="521" text-anchor="middle" fill="#555555">internal resistor built in)</text>
  </g>

  <!-- behaviour notes -->
  <g fill="#1a1a1a" font-size="15">
    <text x="90" y="552"><tspan font-weight="bold">Press</tspan> &#8212; motors run straight off the pack while C1+C2 wind up through R1.</text>
    <text x="90" y="574"><tspan font-weight="bold">Release</tspan> &#8212; motors (and the button LED) run down from the caps: longer press &#8658; longer dance.</text>
    <text x="90" y="596" fill="#555555">Motors wired in opposite polarity so f0 spins in place. Supercaps are polarised &#8212; observe the + marks.</text>
  </g>
</svg>
